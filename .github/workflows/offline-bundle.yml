name: offline-bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*', 'latest']

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Neovim 0.12.5
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux) asset="nvim-linux-x86_64.tar.gz" ;;
            macOS) asset="nvim-macos-arm64.tar.gz" ;;
            *) echo "Unsupported OS ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/v0.12.5/${asset}"
          mkdir -p "$HOME/nvim"
          tar -xzf /tmp/nvim.tar.gz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"

      - name: Build offline bundle
        run: |
          nvim --version
          chmod +x scripts/bundle.sh scripts/install-offline.sh
          ./scripts/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nvim-offline-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF_NAME}" = "latest" ]; then
            if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes
            fi
            gh release create latest artifacts/*.tar.gz \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${DATE}" \
              --notes "Offline Neovim bundle (${DATE}). Contains linux-x86_64 and darwin-arm64 tarballs." \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/*.tar.gz \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
